services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sati_lms
    ports:
      - "5432:5432"
    volumes:
      - sati_lms_postgres:/var/lib/postgresql/data

volumes:
  sati_lms_postgres:
